# Render blueprint for the Anamnesis-AI FastAPI backend.
# Free-tier web service built from the backend Dockerfile.
services:
  - type: web
    name: anamnesis-ai-backend
    runtime: docker
    plan: free
    # dockerfilePath is resolved from the REPO ROOT, and dockerContext is handed to
    # `docker build`. Both point at backend/ so the Dockerfile's `COPY requirements.txt .`
    # and `COPY . .` operate on the backend directory.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_CONCURRENT_SIMULATIONS
        value: "5"
